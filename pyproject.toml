[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiothreema"
version = "0.2.0"
description = "Async Python client for the Threema Gateway HTTP API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Lukas Merz", email = "merz.lukas@gmail.com" }]
keywords = ["threema", "gateway", "messaging", "asyncio", "aiohttp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "aiohttp>=3.9.0",
    "pynacl>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/LukasQ/aiothreema"
Issues = "https://github.com/LukasQ/aiothreema/issues"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aiothreema"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
